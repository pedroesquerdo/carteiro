services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: carteiro-rabbitmq
    hostname: carteiro-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: carteiro
      RABBITMQ_DEFAULT_PASS: carteiro
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
